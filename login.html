<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — MSOP Hosting</title>
<link rel="stylesheet" href="/css/landing.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23a3e635'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%230a0c0a' font-family='sans-serif' font-weight='bold'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1 id="formTitle">Welcome back</h1>
    <p class="tag">Sign in to open your panel.</p>
    <div class="login-err" id="err"></div>
    <button class="google-btn" id="googleBtn">
      <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.5h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2 3.8-5 3.8-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5l-.1.1-3.7 2.9v.1C3.5 21.3 7.5 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.6-2.8-.1.1C.5 8.5 0 10.2 0 12s.5 3.5 1.4 5.1l3.8-2.7z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.5 0 3.5 2.7 1.4 6.9l3.8 2.8c1-2.9 3.7-5 6.8-5z"/></svg>
      Continue with Google
    </button>
    <div class="divider">or</div>
    <form id="emailForm">
      <div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div>
      <button class="btn primary" type="submit" id="emailBtn">Sign in</button>
    </form>
    <p class="login-switch"><span id="switchText">New here?</span> <button id="switchBtn">Create an account</button></p>
    <p class="login-switch" style="margin-top:8px"><a href="/" style="color:var(--faint)">← Back home</a></p>
  </div>
</div>
<script type="module">
import { auth, db } from "/js/firebase-init.js";
import {
  GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let mode = "signin";
const err = document.getElementById("err");
const showErr = (m) => { err.textContent = m; err.style.display = "block"; };

async function afterLogin(user) {
  // ensure user doc exists (for cross-device sync)
  await setDoc(doc(db, "users", user.uid), {
    email: user.email, displayName: user.displayName || user.email?.split("@")[0] || "player",
    updatedAt: serverTimestamp(),
  }, { merge: true });
  location.href = "/panel/";
}
const friendly = (e) => ({
  "auth/invalid-credential": "Wrong email or password.",
  "auth/email-already-in-use": "That email is already registered — sign in instead.",
  "auth/weak-password": "Password needs 6+ characters.",
  "auth/unauthorized-domain": "This domain isn't authorized in Firebase Auth settings.",
  "auth/popup-closed-by-user": "Popup closed — try again.",
}[e.code] || e.message);

document.getElementById("googleBtn").onclick = async () => {
  try { await afterLogin((await signInWithPopup(auth, new GoogleAuthProvider())).user); }
  catch (e) { showErr(friendly(e)); }
};
document.getElementById("emailForm").onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("password").value;
  try {
    const cred = mode === "signin"
      ? await signInWithEmailAndPassword(auth, email, pw)
      : await createUserWithEmailAndPassword(auth, email, pw);
    await afterLogin(cred.user);
  } catch (e2) { showErr(friendly(e2)); }
};
document.getElementById("switchBtn").onclick = () => {
  mode = mode === "signin" ? "signup" : "signin";
  document.getElementById("formTitle").textContent = mode === "signin" ? "Welcome back" : "Create your account";
  document.getElementById("emailBtn").textContent = mode === "signin" ? "Sign in" : "Create account";
  document.getElementById("switchText").textContent = mode === "signin" ? "New here?" : "Have an account?";
  document.getElementById("switchBtn").textContent = mode === "signin" ? "Create an account" : "Sign in";
};
onAuthStateChanged(auth, (u) => { if (u) location.href = "/panel/"; });
</script>
</body>
</html>
